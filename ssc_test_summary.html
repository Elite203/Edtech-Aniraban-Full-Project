<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Summary Component</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0; /* Light gray bg for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* --- SUMMARY MODAL --- */
        .summary-box {
            background-color: #fff;
            width: 700px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #ccc;
        }

        /* Header Bar */
        .summary-header {
            background-color: #dcd6c5; /* Beige */
            padding: 8px 15px;
            font-weight: bold;
            font-size: 14px;
            color: #000;
            text-align: left;
            font-family: Arial, sans-serif; /* Header uses sans-serif usually */
        }

        /* Content Area */
        .summary-content {
            padding: 40px 20px;
            text-align: center;
            font-family: "Times New Roman", Times, serif; /* Serif font for the body text */
            font-size: 20px;
            font-weight: bold;
            color: #000;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Space between lines */
        }

        /* Text Lines */
        .summary-line {
            margin: 0;
        }

        /* Red Number Highlight */
        .num-red {
            color: #ff0000;
        }

    </style>
</head>
<body>

    <div class="summary-box">
        <div class="summary-header">Test Summary</div>
        
        <div class="summary-content">
            <div class="summary-line">
                You have answered <span class="num-red">0</span> questions out of <span class="num-red">100</span> questions.
            </div>
            
            <div class="summary-line">
                You have not answered <span class="num-red">100</span> questions out of <span class="num-red">100</span> questions.
            </div>
            
            <div class="summary-line">
                You have Mark for review <span class="num-red">0</span> questions out of <span class="num-red">100</span> questions.
            </div>
        </div>
    </div>

</body>
</html>

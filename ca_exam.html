<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Interface Mockup</title>
    <style>
        :root {
            --header-red: #cc0000;
            --btn-blue: #0091ea;
            --btn-orange: #ff9800;
            --bg-light: #f0f2f5;
            --border-color: #d1d1d1;
            --sidebar-width: 320px;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--header-red);
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 0 0 40px 40px;
            margin: 0 10px 10px 10px;
            z-index: 10;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 10px;
            gap: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Question Section */
        .question-section {
            flex: 1;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            transition: margin-right 0.3s ease;
        }

        .section-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-tab {
            background: var(--btn-orange);
            color: white;
            padding: 8px 25px;
            border-radius: 25px;
            font-weight: bold;
        }

        .question-content {
            padding: 30px;
            flex: 1;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }

        .option {
            background: #f1f3f4;
            margin: 10px 0;
            padding: 15px;
            border-radius: 35px;
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        /* Sidebar Container */
        .sidebar {
            width: var(--sidebar-width);
            background: #e1f5fe;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border: 1px solid #b3e5fc;
            transition: transform 0.3s ease, width 0.3s ease, opacity 0.2s;
            position: relative;
        }

        /* Collapsed State */
        .sidebar.collapsed {
            width: 0;
            padding: 0;
            margin: 0;
            transform: translateX(20px);
            opacity: 0;
            pointer-events: none;
        }

        /* Toggle Button */
        .toggle-sidebar {
            position: absolute;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            background: #444;
            color: white;
            border: none;
            width: 30px;
            height: 60px;
            cursor: pointer;
            border-radius: 10px 0 0 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .collapsed-toggle {
            position: fixed;
            right: 10px;
            top: 50%;
            display: none;
            background: var(--btn-blue);
            border-radius: 5px;
        }

        /* Sidebar Content Styling */
        .profile-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .pfp-box {
            width: 70px;
            height: 80px;
            background: #333;
            border-radius: 8px;
        }

        .camera-box {
            width: 45px;
            height: 45px;
            background: #fff;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .palette-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            flex: 1;
            margin-top: 10px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .q-num {
            background: white;
            border: 1px solid #ccc;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: bold;
        }

        .q-num.active {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .btn {
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-blue {
            background-color: var(--btn-blue);
        }

        .btn-orange {
            background-color: var(--btn-orange);
        }

        .submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 15px;
        }

        .question-footer {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

    <header>January 2026 current affairs Mock test</header>

    <div class="main-container">
        <button id="openBtn" class="btn btn-blue"
            style="position: absolute; right: 10px; top: 10px; display: none; z-index: 101;">◀ Open Palette</button>

        <div class="question-section">
            <div class="section-header">
                <span class="section-tab">CURRENT AFFAIRS</span>
                <span style="font-weight: bold; font-size: 20px;">TIME LEFT: 00:00</span>
            </div>

            <div class="question-content">
                <strong>Question : 4</strong>
                <p>Sonu and Monu are cycling along a circular track... (Full question text here)</p>

                <div class="option"><input type="radio" name="q"> 6 (option 1)</div>
                <div class="option"><input type="radio" name="q"> 5 (option 2)</div>
                <div class="option"><input type="radio" name="q" checked> 7 (option 3)</div>
                <div class="option"><input type="radio" name="q"> None (option 4)</div>
            </div>

            <div class="question-footer">
                <button class="btn" style="background:#673ab7">Mark for Review & Next</button>
                <button class="btn btn-blue">Clear Response</button>
                <button class="btn btn-orange" style="width: 120px;">Save & Next</button>
            </div>
        </div>

        <div class="sidebar" id="sidebar">
            <button class="toggle-sidebar" onclick="toggleSidebar()">▶</button>

            <div class="profile-area">
                <div class="pfp-box"></div>
                <div class="camera-box">📷</div>
            </div>
            <div style="text-align: center; font-weight: bold; margin: 10px 0;">ANIRBAN MONDAL</div>

            <div class="palette-container">
                <h4 style="text-align:center; margin-top:0;">QUESTION PALETTE</h4>
                <div class="palette-grid">
                    <div class="q-num active">1</div>
                    <div class="q-num active">2</div>
                    <div class="q-num active">3</div>
                    <div class="q-num">4</div>
                    <div class="q-num">5</div>
                    <div class="q-num">6</div>
                    <div class="q-num">7</div>
                    <div class="q-num">8</div>
                </div>
            </div>

            <div style="margin-top:15px;">
                <div style="display: flex; gap: 5px;">
                    <button class="btn btn-blue" style="flex:1">Question Paper</button>
                    <button class="btn btn-blue" style="flex:1">Instructions</button>
                </div>
                <button class="btn btn-orange submit-btn">Submit</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const openBtn = document.getElementById('openBtn');

            sidebar.classList.toggle('collapsed');

            // Show the "Open" button if collapsed, hide if open
            if (sidebar.classList.contains('collapsed')) {
                setTimeout(() => { openBtn.style.display = 'block'; }, 200);
            } else {
                openBtn.style.display = 'none';
            }
        }

        // Attach event to the reopen button
        document.getElementById('openBtn').addEventListener('click', toggleSidebar);
    </script>
</body>

</html>

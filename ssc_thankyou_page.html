<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Completed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8; /* Light blue-grey background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* --- CARD CONTAINER --- */
        .thank-you-card {
            background-color: #fff;
            padding: 50px 80px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1); /* Soft shadow */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- LOGO --- */
        .ssc-logo {
            height: 80px;
            width: auto;
            margin-bottom: 25px;
        }

        /* --- TEXT --- */
        .message-text {
            font-size: 24px;
            font-weight: bold;
            color: #222; /* Dark grey/black */
            white-space: nowrap; /* Keep text on one line */
        }

    </style>
</head>
<body>

    <div class="thank-you-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Staff_Selection_Commission_Logo.svg" alt="SSC Logo" class="ssc-logo">
        
        <div class="message-text">Thank you for taking the test</div>
    </div>

</body>
</html>
